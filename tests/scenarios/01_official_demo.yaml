name: Official demo - verify in one utterance, use remembered hint, email summary
turns:
  - say: "I'm the policyholder. My name is Margaret Chen, policy POL-9921. I'm calling about my denied healthcare claim from January. DOB is 1985-03-15, SSN last four is 4472."
    expect: {phase: PROCESS_CASE, verified: true, selected_case: CL-2048, reply_mentions_any: [pathology, office note]}
  - say: "How soon do I need to submit them?"
    expect: {phase: PROCESS_CASE, reply_mentions_any: [week]}
  - say: "That's all, thanks."
    expect: {phase: POST_PROCESS, reply_mentions_any: [email]}
  - say: "Yes, please send it."
    expect: {phase: ENDED, email_sent: true}
