name: Official demo - verify in one utterance, use remembered hint, email summary
# CL-2048: denied, allowed max $1,450.00, expected reimbursement / net pay $0.00,
# missing pathology report + office note, appeal deadline 2026-03-18 (17 days after the demo date)
turns:
  - say: "I'm the policyholder. My name is Margaret Chen, policy POL-9921. I'm calling about my denied healthcare claim from January. DOB is 1985-03-15, SSN last four is 4472."
    expect:
      phase: PROCESS_CASE
      verified: true
      selected_case: CL-2048
      reply_mentions_all: [pathology, office note]
      reply_mentions_any: [March 18, "2026-03-18", 17 days]
      amounts_allowed: ["0.00", "1450.00"]
      reply_not_matching:
        - '(?i)(reimburs\w*|receive|be paid|payout)[^.$]{0,30}\$\s?1,?450'
        - '(?i)\b\d+\s+months?\b'
        - '(?i)\b(guarantee|will be approved|will be paid)\b'
  - say: "How soon do I need to submit them?"
    expect: {phase: PROCESS_CASE, reply_mentions_any: [week], amounts_allowed: ["0.00", "1450.00"]}
  - say: "That's all, thanks."
    expect: {phase: POST_PROCESS, reply_mentions_any: [email]}
  - say: "Yes, please send it."
    expect:
      phase: ENDED
      email_sent: true
      email_no_pii: true
      email_mentions_all: [CL-2048, pathology, office note]
      email_mentions_any: [March 18, "2026-03-18"]
      email_amounts_allowed: ["0.00", "1450.00"]
